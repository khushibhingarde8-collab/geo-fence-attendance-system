name: geo_attendance_app
description: "Geo Attendance App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 🌐 API
  http: ^1.6.0

  # 📍 Location
  geolocator: ^13.0.2
  permission_handler: ^11.0.0

  # 🗺️ OpenStreetMap (FREE alternative to Google Maps)
  flutter_map: ^6.1.0
  latlong2: ^0.9.1

  # ✨ UI Animations (optional)
  flutter_animate: ^4.5.0

  pdf: ^3.11.0
  printing: ^5.13.0
  shared_preferences: ^2.5.5

  firebase_core: ^3.15.2
  firebase_messaging: ^15.0.4
  flutter_local_notifications: ^17.2.2

  flutter_background_service: ^5.1.0
  flutter_background_service_android: ^6.3.0

  path_provider: ^2.1.4
  open_filex: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/GeoMark.png"
  min_sdk_android: 21