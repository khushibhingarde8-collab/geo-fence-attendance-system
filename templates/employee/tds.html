<!DOCTYPE html>
<html>
<head>
    <title>TDS Certificates</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>Your TDS Certificates</h1>
        
        <form method="POST">
            <label>Financial Year</label>
            <select name="year">
                {% for year in years %}
                <option value="{{ year }}">{{ year }}</option>
                {% endfor %}
            </select>

            <label>Quarter</label>
            <select name="quarter">
                <option value="Q1">Q1</option>
                <option value="Q2">Q2</option>
                <option value="Q3">Q3</option>
                <option value="Q4">Q4</option>
            </select>

            <button type="submit">Search</button>
        </form>

        {% if result %}
        <div class="result">
            <p>File Found: {{ result[0] }}</p>
            <a href="/download/{{ result[1] }}" class="btn">Download Certificate</a>
        </div>
        {% elif request.method == 'POST' %}
        <p>No certificate found for this period.</p>
        {% endif %}
        
        <br>
        <a href="/">Back to Home</a>
    </div>
</body>
</html>
