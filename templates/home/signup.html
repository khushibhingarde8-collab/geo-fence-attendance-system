<!doctype html>
<html>
  <head>
    <title>Sign Up - PCE</title>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='home/auth.css') }}"
    />

    <script
      src="{{ url_for('static', filename='security.js') }}"
      defer
    ></script>

    <script
      src="{{ url_for('static', filename='home/loginsignup.js') }}"
      defer
    ></script>
  </head>
  <body>
    <div class="auth-container">
      <div class="logo-container">
        <img src="static/home/logos/PCE_2.png" class="logo" alt="Logo" />
      </div>
      <h2>Employee Sign Up</h2>

      <form id="signupForm">
        <label>Full Name</label>
        <input
          type="text"
          id="fullname"
          maxlength="40"
          placeholder="Enter full name"
          required
        />

        <label>Personal Email</label>
        <input
          type="email"
          id="email"
          maxlength="30"
          placeholder="Enter personal email"
          required
        />

        <label>Phone Number</label>
        <input
          type="tel"
          id="phone"
          maxlength="13"
          placeholder="Enter phone number"
          required
        />

        <label>Create Password</label>
        <input
          type="password"
          id="password"
          maxlength="20"
          minlength="8"
          placeholder="Create password"
          required
        />

        <button type="submit">Register</button>
      </form>

      <p>Already have account? <a href="/login">Login</a></p>
    </div>
  </body>
</html>
